services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: taskdb
      POSTGRES_USER: taskuser
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets:
      - db_password
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskuser -d taskdb"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  nginx:
    image: nginx:1.29-alpine
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8080:80"
    networks:
      - backend
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/health > /dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  migrate:
    image: postgres:17-alpine
    secrets:
      - db_password
    volumes:
      - ./migrations:/migrations:ro
    networks:
      - backend
    depends_on:
      db:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - |
        export PGPASSWORD="$$(cat /run/secrets/db_password)"
        exec psql -h db -U taskuser -d taskdb -f /migrations/001_create_tasks.sql
    restart: "no" 

  app:
    image: ghcr.io/sayu47/devops-task-tracker:${IMAGE_TAG}
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: taskdb
      DB_USER: taskuser
      DB_PASSWORD_FILE: /run/secrets/db_password
    secrets:
      - db_password
    expose:
      - "8080"
    networks:
      - backend
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully  
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health > /dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

secrets:
  db_password:
    file: ./secrets/db_password.txt

volumes:
  db_data:

networks:
  backend:
    driver: bridge